services:
  postgres:
    image: postgres:17
    container_name: rlearnhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rlearnhub
      POSTGRES_USER: rlearnhub
      POSTGRES_PASSWORD: rlearnhub123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: